name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm lint

      # The pre-commit hook reformats staged files, so formatting drift only
      # ever reaches this repo through a commit that bypassed it. Without a
      # check here nothing holds the line, and the next hook run mixes
      # formatting noise into whatever real diff happens to touch the file.
      - run: pnpm exec prettier --check .

      - run: pnpm test
      - run: pnpm build

      # The e2e suite runs a `desktop` project on Chromium and a `mobile`
      # project on WebKit (devices["iPhone 14 Pro"]) — both engines must be
      # installed, not just Chromium, or the mobile project fails to launch.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
